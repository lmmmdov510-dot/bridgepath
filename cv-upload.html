<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BridgePath — CV Yüklə</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: white; display: flex; min-height: 100vh; }

        .sidebar {
            width: 260px; background: rgba(255,255,255,0.04);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 30px 20px; display: flex; flex-direction: column;
            position: fixed; height: 100vh;
        }
        .logo { font-size: 22px; font-weight: 800; color: #6c63ff; margin-bottom: 40px; padding-left: 10px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; border-radius: 12px; cursor: pointer;
            margin-bottom: 6px; font-size: 15px; opacity: 0.6;
            transition: all 0.2s; text-decoration: none; color: white;
        }
        .nav-item:hover, .nav-item.active { background: rgba(108,99,255,0.15); opacity: 1; color: #6c63ff; }
        .nav-item span { font-size: 20px; }
        .sidebar-bottom { margin-top: auto; }

        .main { margin-left: 260px; padding: 40px; flex: 1; }
        .header { margin-bottom: 40px; }
        .header h1 { font-size: 26px; font-weight: 700; }
        .header p { opacity: 0.5; font-size: 14px; margin-top: 4px; }

        .upload-area {
            border: 2px dashed rgba(108,99,255,0.4);
            border-radius: 24px; padding: 60px;
            text-align: center; cursor: pointer;
            transition: all 0.3s; margin-bottom: 30px;
            background: rgba(108,99,255,0.05);
        }
        .upload-area:hover { border-color: #6c63ff; background: rgba(108,99,255,0.1); }
        .upload-icon { font-size: 64px; margin-bottom: 20px; }
        .upload-area h3 { font-size: 22px; margin-bottom: 10px; }
        .upload-area p { opacity: 0.5; font-size: 14px; margin-bottom: 24px; }
        .btn-upload {
            background: linear-gradient(135deg, #6c63ff, #a855f7);
            border: none; padding: 14px 32px; border-radius: 12px;
            color: white; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: transform 0.2s;
        }
        .btn-upload:hover { transform: translateY(-2px); }

        .analyzing { display: none; text-align: center; padding: 40px; }
        .analyzing.show { display: block; }
        .spinner {
            width: 60px; height: 60px; border: 4px solid rgba(108,99,255,0.2);
            border-top-color: #6c63ff; border-radius: 50%;
            animation: spin 1s linear infinite; margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result { display: none; }
        .result.show { display: block; }
        .score-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px; padding: 40px; text-align: center; margin-bottom: 24px;
        }
        .score-big { font-size: 80px; font-weight: 800; color: #6c63ff; line-height: 1; }
        .score-label { opacity: 0.5; margin-top: 8px; font-size: 16px; }
        .score-bar { background: rgba(255,255,255,0.1); border-radius: 50px; height: 14px; margin: 24px 0 16px; }
        .score-fill { height: 100%; border-radius: 50px; background: linear-gradient(90deg, #6c63ff, #a855f7); width: 75%; transition: width 1s ease; }

        .feedback-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .feedback-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 24px;
        }
        .feedback-card h4 { font-size: 15px; margin-bottom: 14px; }
        .feedback-card ul { list-style: none; }
        .feedback-card ul li { font-size: 14px; opacity: 0.7; margin-bottom: 8px; padding-left: 20px; position: relative; }
        .feedback-card ul li::before { content: '•'; position: absolute; left: 0; color: #6c63ff; }
        .good { border-color: rgba(108,99,255,0.3); }
        .bad { border-color: rgba(255,100,100,0.3); }

        .btn-jobs {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, #6c63ff, #a855f7);
            border: none; border-radius: 12px; color: white;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-jobs:hover { transform: translateY(-2px); }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="logo">BridgePath</div>
    <a href="dashboard.html" class="nav-item"><span>🏠</span> Dashboard</a>
    <a href="cv-upload.html" class="nav-item active"><span>📄</span> CV Yüklə</a>
    <a href="jobs.html" class="nav-item"><span>🔍</span> İş İmkanları</a>
    <a href="messages.html" class="nav-item"><span>✉️</span> Mesajlar</a>
    <div class="sidebar-bottom">
        <a href="index.html" class="nav-item"><span>🚪</span> Çıxış</a>
    </div>
</div>

<div class="main">
    <div class="header">
        <h1>📄 CV Yüklə və Analiz Et</h1>
        <p>CV-ni yüklə, AI dərhal skoru və tövsiyələri göstərsin</p>
    </div>

    <!-- Upload Area -->
    <div class="upload-area" id="uploadArea" onclick="startAnalysis()"></div>"
